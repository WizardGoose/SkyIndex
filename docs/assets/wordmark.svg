<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Skydex">
  <title>Skydex</title>
  <!--
    The Skydex wordmark. Letters are Montserrat outlines converted to paths, so
    this renders the same everywhere with no webfont and no network request.
    Weight 800 is the local Bold (700) and Black (900) statics interpolated at
    t=0.5; they are point compatible, so the interpolation is clean.

    The diagonal seam is the same one as src/ui/Wordmark.tsx: a hard cut, no
    blend, rising left to right so the accent lands on DEX rather than SKY.
    Geometry is the CSS gradient line for linear-gradient(171.3deg, ...) over
    the element box, recomputed in user space; the stop sits at 47.4% rather
    than 50% because at 50% the seam terminates on the X's top right corner and
    clips a white speck onto the end of the word.

    Card ground is slate-900 and the border is slate-100 at 12%, so the banner
    carries its own dark ground and reads on a light or a dark page alike.
  -->
  <defs>
    <linearGradient id="seam" gradientUnits="userSpaceOnUse" x1="582.41" y1="17.28" x2="622.62" y2="280.05">
      <stop offset="47.4%" stop-color="#e8edf3"/>
      <stop offset="47.4%" stop-color="#38bdf2"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="18" fill="#13161d" stroke="rgba(232,237,243,0.12)" stroke-width="1"/>
