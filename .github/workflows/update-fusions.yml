name: Update Fusion Data

on:
  repository_dispatch:
    types: [update-fusion-data]

permissions:
  contents: write

jobs:
  update-fusion-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: master

      - name: Download and validate the latest fusion data
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output release.json \
            https://api.github.com/repos/Campionnn/SkyShards-Parser/releases/latest

          ASSET_URL_DATA=$(jq -er '.assets[] | select(.name == "fusion-data.json") | .browser_download_url' release.json)
          ASSET_URL_PROP=$(jq -er '.assets[] | select(.name == "fusion-properties.json") | .browser_download_url' release.json)

          case "$ASSET_URL_DATA" in
            https://github.com/Campionnn/SkyShards-Parser/releases/download/*) ;;
            *) echo "Unexpected fusion-data asset host" >&2; exit 1 ;;
          esac
          case "$ASSET_URL_PROP" in
            https://github.com/Campionnn/SkyShards-Parser/releases/download/*) ;;
            *) echo "Unexpected fusion-properties asset host" >&2; exit 1 ;;
          esac

          curl --fail --silent --show-error --location --proto '=https' --max-filesize 5000000 \
            --output fusion-data.next.json "$ASSET_URL_DATA"
          curl --fail --silent --show-error --location --proto '=https' --max-filesize 1000000 \
            --output fusion-properties.next.json "$ASSET_URL_PROP"

          jq -e '.recipes | type == "object" and length > 0' fusion-data.next.json > /dev/null
          jq -e 'type == "object" and length > 0 and all(.[]; (.name | type) == "string")' \
            fusion-properties.next.json > /dev/null

          mv fusion-data.next.json public/fusion-data.json
          mv fusion-properties.next.json public/fusion-properties.json
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit and push updated fusion-data.json
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/fusion-data.json
          git add public/fusion-properties.json
          git commit -m "Update fusion-data.json and fusion-properties.json from SkyShards-Parser release" || echo "No changes to commit"
          git push origin HEAD:master
