name: Build companion mod

on:
  push:
    branches: [master]
    paths:
      - "mod/**"
      - ".github/workflows/mod-build.yml"
  pull_request:
    paths:
      - "mod/**"
      - ".github/workflows/mod-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mod-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build (Java 25)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: mod

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Test and build mod
        run: ./gradlew build --no-daemon

      - name: Upload runnable mod JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skyindex-mod-${{ github.sha }}
          path: |
            mod/build/libs/skyindex-*.jar
            !mod/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
