<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- MANUAL RENAME SPOT 1 of 2. Static HTML cannot import, so this literal is
         a copy of SITE_NAME in src/ui/brand.ts, which is the source of truth. -->
    <title>Skydex</title>
    <meta name="description" content="Personal Hypixel SkyBlock toolkit: greenhouse planner, shard fusion calculator, recipes." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="dark" />

    <!-- First paint reads the same semantic theme tokens as the mounted app.
         Preloading the shipped backdrop prevents a flat dark frame while the
         JavaScript bundle starts. -->
    <link rel="stylesheet" href="/theme.css" />
    <link rel="preload" as="image" href="/bg/hub.jpg" fetchpriority="high" />

    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon/favicon.png" />

    <!-- No font preconnects. Every typeface the site uses is served from
         /fonts on this origin, declared in src/index.css, so there is no
         third-party socket to open early. -->

  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="text-align: center; padding: 2rem; font-family: system-ui, sans-serif; color: #d8d2e2">
        <!-- MANUAL RENAME SPOT 2 of 2. Same story: a copy of SITE_NAME in
             src/ui/brand.ts, which is the source of truth. -->
        <h1>Skydex</h1>
        <p>This tool requires JavaScript.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
